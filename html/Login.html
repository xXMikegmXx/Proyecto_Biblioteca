<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="css/login.css">
        <script src="/js/Login.js" ></script>
        <meta charset="utf-8">
    </head>
    <body>
        <div class="Izquierda">
            
            <img src="recursos/Maestro.png">
        </div>
        <div class="Derecha">
            <p>Bienvenido</p>
            <p>Ingresa tus credenciales</p>
            <form id="login">
                <label>Número de boleta</label>
                <input id="boleta" name="boleta">
                <label>Contraseña</label>
                <input id="password" name="password">
                <button type="button" onclick="IniciarSesion()">Ingresar</button>
            </form>
            
            <p>¿No tienes cuenta? <a href="/registro">Crea una nueva cuenta aqui</a></p>
        </div>
    </body>
</html>
