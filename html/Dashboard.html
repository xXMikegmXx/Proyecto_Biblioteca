            >

        </div>
        
        <ul class="nav-list">
            <li class="nav-item"><a href="#home">Inicio</a></li>

            <li class="nav-item"><a href="#contacto">Contacto</a></li>
        </ul>
    </nav>

    <main class="content">
        <h1>Contenido Principal (fondo de distinto color.)</h1>
        <p>Este es el espacio a la derecha, con fondo de color.</p>
    </main>

</body>
</html>
