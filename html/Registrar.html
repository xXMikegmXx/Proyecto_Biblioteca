<!DOCTYPE html>
<html>
    <head>
        <script src="/js/Librerias/html5-qrcode.min.js" ></script>

        <link rel="stylesheet" href="/css/registro.css">
    </head>

                <input id="correo">
                <label>Carrera</label>
                <select>
                    <option>Telemática</option>
                    <option>Mecatrónica</option>
                    <option>Bionica</option>
                </select>
                <label>Contraseña</label>
                <input id="password">
                <label>Repetir Contraseña</label>
                <input>
            </form>
            <button>Registrar</button>
        </div>
        <div class="Derecha">
            <p>Validación</p>
            <p>Escanea el QR de tu credencial para validar tu información</p>
            <div id="view" style="width: 250px; height: 250px;">   
            </div>
        </div>
    </body>
</html>
