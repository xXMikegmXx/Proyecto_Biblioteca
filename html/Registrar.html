<!DOCTYPE html>
<html>
    <head>
        <script src="/js/Librerias/html5-qrcode.min.js" ></script>
        <script src="/js/FormularioScaner.js" ></script>
        <script src="/js/Registro.js" ></script>
        <link rel="stylesheet" href="/css/registro.css">
        <title>Biblioteca (UPIITA)</title>
        <link rel="icon" type="image/png" href="/recursos/libro.png">
        <meta charset="utf-8">
    </head>
    <body>
        
        <div class="Izquierda">
            <p>Crear una cuenta</p>
            
            <p>Ingresar tus datos</p>

            <form id="form">
                <div>
                    <label for="nombre">Nombres(s)</label>
                    <input id="nombre" name="nombre">
                </div>
                <div>
                    <label for="apellidoP">Apellido paterno</label>
                    <input id="apellidoP" name="apellidoP"> 
                </div>
                <div>
                    <label for="apellidoM">Apellido materno</label>
                    <input id="apellidoM" name="apellidoM">
                </div>
                
                <div>
                    <label for="boleta">Número de boleta</label>
                    <input id="boleta" name="boleta">  
                </div>
                <div>
                    <label for="correo">Correo Electrónico</label>
                    <input id="correo" name="correo">
                </div>
                <div>
                     <label for="carrera">Carrera</label>
                    <select id="carrera" name="carrera">
                        <option value="INGENIERÍA TELEMÁTICA">INGENIERÍA TELEMÁTICA</option>
                        <option value="INGENIERÍA MECATRÓNICA">INGENIERÍA MECATRÓNICA</option>
                        <option value="INGENIERÍA BIÓNICA">INGENIERÍA BIÓNICA</option>
                        <option value="INGENIERÍA EN ENERGÍA">INGENIERÍA EN ENERGÍA</option>
                        <option value="INGENIERÍA EN SISTEMAS AUTOMOTRICES (ISISA)">INGENIERÍA EN SISTEMAS AUTOMOTRICES (ISISA)</option>
                        <option value="POSGRADO">SECCIÓN DE ESTUDIOS DE POSGRADO E INVESTIGACIÓN</option>
                    </select>
                </div>
                <div>
                    <label for="password">Contraseña</label>
                    <input id="password" name="password">
                </div>
                <div>
                    <label for="repetir">Repetir Contraseña</label>
                    <input id="repetir">
                </div>
                <div>
                    <label for="sexo">Sexo</label>
                    <select id="sexo" name="sexo">
                        <option value="M">Masculino</option>
                        <option value="F">Femenino</option>                        
                    </select>
                </div>
            </form>
            <button onclick="RegistrarAlumno()">Registrar</button>
            <p>Ya tienes una cuenta <a href="/login">Ingresa aqui</a></p>
        </div>
        <div class="Derecha" id="Derecha">
            <p>Validación</p>
            <p>Escanea el QR de tu credencial para validar tu información</p>
            <div id="view" style="width: 250px; height: 250px;">   
            </div>
        </div>
    </body>
</html>
